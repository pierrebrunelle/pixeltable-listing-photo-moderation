[project]
name = "pixeltable-listing-photo-moderation"
version = "0.1.0"
description = "Trust-and-safety pipeline for marketplace listings: text moderation, a gpt-4o-mini vision verdict with boxes, box post-processing and mAP against human labels, per-frame video checks and voice-over transcripts scanned for off-platform contact - built with Pixeltable"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pierre Brunelle" }]
keywords = ["pixeltable", "multimodal", "ai", "computed-columns", "data-infrastructure", "listing-photo-moderation"]
dependencies = [
    "pixeltable>=0.7.20",
    "openai>=3",
]

[project.urls]
Homepage = "https://pixeltable.com"
Documentation = "https://docs.pixeltable.com"
Pixeltable = "https://github.com/pixeltable/pixeltable"
